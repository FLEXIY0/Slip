[package]
name = "slip"
version = "1.0.0"
description = "Slip videos through impossible upload limits."
authors = ["Slip"]
license = "MIT"
repository = "https://github.com/flexiy0/slip"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "slip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# By default Tauri runs in production mode; `custom-protocol` is required for release.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
