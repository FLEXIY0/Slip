name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Required so tauri-action can create a GitHub Release when built from a tag.
permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf ffmpeg

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Windows ships FFmpeg as a bundled sidecar so the installer works with
      # no separate FFmpeg install. Other platforms resolve it at runtime
      # (PATH / user-selected path / package dependency on Linux).
      - name: Fetch FFmpeg sidecar (Windows)
        if: matrix.os == 'windows-latest'
        run: node scripts/fetch-ffmpeg.mjs ${{ matrix.target }}

      # Build the app. A GitHub Release is only created/published when the
      # workflow runs from a version tag (refs/tags/v*). On branch pushes or
      # manual runs, tagName is empty, so tauri-action just builds — no release,
      # which avoids the "Resource not accessible by integration" error.
      - name: Build Slip
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Slip {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      # Always make the installers downloadable from the run itself.
      # The bundle dir holds .msi/.exe (Windows), .dmg/.app (macOS),
      # .AppImage/.deb/.rpm (Linux) — exactly the paths tauri prints.
      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slip-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Web (PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: slip-web
          path: dist
          retention-days: 14
