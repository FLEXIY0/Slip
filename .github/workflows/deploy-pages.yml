name: Deploy Web (GitHub Pages)

on:
  push:
    branches: [main]
    paths-ignore:
      - "src-tauri/**"
      - "**/*.md"
  workflow_dispatch:

# Enable once: repo Settings → Pages → Build and deployment → Source: GitHub Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer runs supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (subpath base)
        env:
          # Pages serves a project site under /<repo>/ — match Vite's base to it.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - name: SPA fallback + disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
